<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mgmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#mgmGrad)" />
  <!-- Inner border -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Financial Crest / Shield -->
  <g transform="translate(106, 80)">
    <!-- Shield Outline -->
    <path d="M150 0 L270 50 C270 180 190 260 150 290 C110 260 30 180 30 50 Z" 
          fill="#064e3b" stroke="#34d399" stroke-width="8" opacity="0.95" />
    <!-- Inner Shield Accent -->
    <path d="M150 24 L250 64 C250 168 185 236 150 262 C115 236 50 168 50 64 Z" 
          fill="url(#goldGrad)" opacity="0.25" />
    
    <!-- Letter M G M Crest -->
    <text x="150" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="4">MGM</text>
    
    <!-- Rupee / Checkmark Emblem -->
    <circle cx="150" cy="190" r="32" fill="#10b981" />
    <path d="M140 190 L147 197 L162 182" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Bottom Subtitle Banner -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="700" font-size="28" fill="#a7f3d0" text-anchor="middle" letter-spacing="3">PAYMENT OPERATIONS</text>
  <text x="256" y="454" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="500" font-size="18" fill="#6ee7b7" text-anchor="middle" letter-spacing="1">MGM FINANCIERS PVT LTD</text>
</svg>
