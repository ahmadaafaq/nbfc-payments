<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="600" height="140">
  <defs>
    <!-- Background subtle pill -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Wing Left Gradient -->
    <linearGradient id="logoWingLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>

    <!-- Wing Right Gradient -->
    <linearGradient id="logoWingRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="logoShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7c3aed" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(10, 10)" filter="url(#logoShadow)">
    <rect width="120" height="120" rx="30" fill="url(#logoBgGrad)" stroke="#7c3aed" stroke-width="2.5" stroke-opacity="0.6" />
    
    <!-- Geometric MGM Structure inside Icon -->
    <g transform="translate(14, 14) scale(0.24)">
      <path d="M70 320 L70 140 C70 125 85 115 98 122 L150 150 C158 154 163 163 163 172 L163 320 C163 328 155 334 147 331 L86 306 C76 302 70 293 70 283 Z" fill="url(#logoWingLeft)" />
      <path d="M310 320 L310 140 C310 125 295 115 282 122 L230 150 C222 154 217 163 217 172 L217 320 C217 328 225 334 233 331 L294 306 C304 302 310 293 310 283 Z" fill="url(#logoWingRight)" />
      <path d="M190 80 L240 160 C245 168 240 178 231 178 L149 178 C140 178 135 168 140 160 Z" fill="url(#logoShield)" />
      <circle cx="190" cy="205" r="18" fill="#10b981" />
      <path d="M182 205 L188 211 L200 199" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M110 315 C150 340 230 340 270 315" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />
    </g>
  </g>

  <!-- Typography Lockup -->
  <!-- Primary Title -->
  <text x="148" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="url(#textGrad)" letter-spacing="1.5">
    MGM <tspan fill="#a78bfa" font-weight="700">FINANCIERS</tspan>
  </text>

  <!-- Secondary Product Subtitle -->
  <text x="148" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#34d399" letter-spacing="2">
    PAYMENT OPERATIONS &amp; COMMISSION ENGINE
  </text>

  <!-- Tertiary Legal / NBFC Tagline -->
  <text x="148" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12" fill="#94a3b8" letter-spacing="0.8">
    MGM FINANCIERS PVT LIMITED • ENTERPRISE NBFC PLATFORM
  </text>
</svg>
